name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate Scaffolding & Inject PillMind Code
        run: |
          flutter create pillmind_app --platforms=android --org com.pillmind
          cp pubspec.yaml pillmind_app/pubspec.yaml
          rm -rf pillmind_app/lib
          cp -r lib pillmind_app/lib
          sed -i 's/flutter.minSdkVersion/21/g' pillmind_app/android/app/build.gradle || true

      - name: Get Dependencies
        run: |
          cd pillmind_app
          flutter pub get

      - name: Build APK
        run: |
          cd pillmind_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillMind-AI-Release-APK
          path: pillmind_app/build/app/outputs/flutter-apk/app-release.apk
